description: >
  Multi-view training pipeline (N-view) guidance for code modifications.
  Includes high-level actions, target files, and best practices.

files:
  - baseModels.py
  - trainer.py
  - loss.py
  - utils.py

n_views_notes:
  - encode_views: zero missing latents
  - attention_layer: mask before softmax, avoid N-view explosion
  - diffusion: one UNet per view, independent denoising
  - high_conf_loss: replace elementwise max with mean or entropy-weighted
  - contrastive_loss: consider sampling to reduce O(N²)
  - MMI_loss: compute per-view, skip if present.sum() <= 1

masking_notes:
  - get_mask: enforce at least one view per sample
  - log per-view coverage
  - optionally rebalance rare views

objective_notes:
  - normalize all losses (LR, LI, LD, LC)
  - use outer lambda weights to balance branches
  - save source_mode in checkpoint for eval consistency

tasks:
  - refactor loops for N-view scaling
  - stabilize attention weights numerically
  - improve diffusion conditioning fusion
  - reduce contrastive cost if N is large
  - log key stats per-view and per-loss

validation:
  - small training run
  - check total loss, per-view losses, NaNs
  - gradient stability