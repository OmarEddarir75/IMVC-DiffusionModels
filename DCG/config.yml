runtime:
  print_num: 1
  missing_rates:
    - 0.3

datasets:
  ids:
    1: LandUse_21
    2: CUB
    3: HandWritten
    4: Multi-Fashion
    5: Synthetic3d
  default: Synthetic3d

defaults:
  diffusion:
    emb_size: 128
    time_type: sinusoidal
  noise_scheduler:
    beta_schedule: linear
  training:
    rec_weight: 1.0
    diff_weight: 1.0
    ce_weight: 1.0
    mmi_weight: 1.0
    cluster_weight: 0.1
    hc_weight: 0.1

configs:
  Synthetic3d:
    Autoencoder:
      arch1: [3, 1024, 1024, 1024, 128]
      arch2: [3, 1024, 1024, 1024, 128]
      activations1: relu
      activations2: relu
      batchnorm: true
    training:
      seed: 6
      mask_seed: 5
      missing_rate: 0.3
      batch_size: 256
      epoch: 20
      lr: 1.0e-4
      mmi_weight: 1.0
      cluster_weight: 0.1
      rec_weight: 1.0
      diff_weight: 1.0
      ce_weight: 1.0
      mmi_weight: 1.0
      cluster_weight: 0.1
      hc_weight: 0.1
      n_clusters: 3
    diffusion:
      emb_size: 128
      time_type: sinusoidal
      out_dim1: 128
      out_dim2: 128
    noise_scheduler:
      num_timesteps: 100
      beta_schedule: linear

  HandWritten:
    Autoencoder:
      arch1: [76, 1024, 1024, 1024, 128]
      arch2: [64, 1024, 1024, 1024, 128]
      activations1: relu
      activations2: relu
      batchnorm: true
    training:
      seed: 6
      mask_seed: 5
      missing_rate: 0.3
      batch_size: 256
      epoch: 200
      lr: 1.0e-4
      mmi_weight: 1.0
      cluster_weight: 0.1
      rec_weight: 1.0
      diff_weight: 1.0
      ce_weight: 1.0
      mmi_weight: 1.0
      cluster_weight: 0.1
      hc_weight: 0.1
      n_clusters: 10
    diffusion:
      emb_size: 128
      time_type: sinusoidal
      out_dim1: 128
      out_dim2: 128
    noise_scheduler:
      num_timesteps: 200
      beta_schedule: linear

  Multi-Fashion:
    Autoencoder:
      arch1: [784, 1024, 1024, 1024, 128]
      arch2: [784, 1024, 1024, 1024, 128]
      activations1: relu
      activations2: relu
      batchnorm: true
    training:
      seed: 2
      mask_seed: 5
      missing_rate: 0.3
      batch_size: 256
      epoch: 200
      lr: 1.0e-4
      mmi_weight: 10.0
      cluster_weight: 0.1
      rec_weight: 1.0
      diff_weight: 1.0
      ce_weight: 1.0
      mmi_weight: 10.0
      cluster_weight: 0.1
      hc_weight: 0.1
      n_clusters: 10
    diffusion:
      emb_size: 128
      time_type: sinusoidal
      out_dim1: 128
      out_dim2: 128
    noise_scheduler:
      num_timesteps: 50
      beta_schedule: linear

  CUB:
    Autoencoder:
      arch1: [1024, 512, 1024, 1024, 128]
      arch2: [300, 512, 1024, 1024, 128]
      activations1: sigmoid
      activations2: relu
      batchnorm: true
    training:
      seed: 8
      mask_seed: 5
      missing_rate: 0.5
      batch_size: 256
      epoch: 200
      lr: 1.0e-4
      num: 10
      dim: 256
      alpha: 9
      mmi_weight: 0.1
      cluster_weight: 0.1
      rec_weight: 1.0
      diff_weight: 1.0
      ce_weight: 1.0
      mmi_weight: 0.1
      cluster_weight: 0.1
      hc_weight: 0.1
      n_clusters: 10
    diffusion:
      emb_size: 128
      time_type: sinusoidal
      out_dim1: 128
      out_dim2: 128
    noise_scheduler:
      num_timesteps: 100
      beta_schedule: linear

  LandUse_21:
    Autoencoder:
      arch1: [59, 1024, 1024, 1024, 128]
      arch2: [40, 1024, 1024, 1024, 128]
      activations1: relu
      activations2: relu
      batchnorm: true
    training:
      seed: 3
      mask_seed: 5
      missing_rate: 0.5
      batch_size: 256
      epoch: 200
      lr: 1.0e-4
      alpha: 9
      mmi_weight: 0.1
      cluster_weight: 0.1
      temperature_f: 0.5
      temperature_l: 1
      rec_weight: 1.0
      diff_weight: 1.0
      ce_weight: 1.0
      mmi_weight: 0.1
      cluster_weight: 0.1
      hc_weight: 0.1
      n_clusters: 21
    diffusion:
      emb_size: 128
      time_type: sinusoidal
      out_dim1: 128
      out_dim2: 128
    noise_scheduler:
      num_timesteps: 100
      beta_schedule: linear
