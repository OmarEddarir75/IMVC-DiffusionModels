description: >
  Implementation guide for extending the DCG training pipeline from 2 views to V views.
  Use this file when modifying model, loss, masking, or training logic.

scope:
  goal: Scale the pipeline cleanly from 2 views to V views.
  target_files:
    - baseModels.py
    - ICDM.py
    - loss.py
    - util.py
    - configure.py
    - run.py
    - get_indicator_matrix_A.py

n_view_design:
  encode_views:
    - Replace hardcoded `x1`/`x2` handling with indexed view lists.
    - Zero out latent vectors only for truly missing view entries.
    - Support variable view dimensionality by using per-view config.
  attention_layer:
    - Replace 2-view pairwise fusion with multi-view fusion.
    - Apply mask before softmax to avoid absent-view contributions.
    - Prefer normalized weighted sum or self-attention over elementwise max.
    - Avoid operations that scale O(V^2) when V grows.
  diffusion:
    - Maintain one UNet denoiser per view.
    - Keep denoising independent per view, with shared scheduler logic.
    - Condition diffusion on latent presence and view index only.
  high_confidence_loss:
    - Replace max-based target distributions with mean or entropy-weighted fusion.
    - Use a globally fused representation rather than just pairwise maxima.
  contrastive_loss:
    - Use view sampling or approximate all-pairs if batch size or V is large.
    - Aim to keep cost lower than O(V^2 * B^2).
    - Use fused global target as anchor when cross-view pairing is too expensive.
  mmi_loss:
    - Compute MMI per available view against the fused representation.
    - Skip any view with `present.sum() <= 1` to avoid degenerate statistics.

masking:
  requirements:
    - Enforce at least one observed view per sample.
    - Represent masks as shape `[N, V]`.
    - Log per-view coverage statistics after mask creation.
  optional:
    - Rebalance rare views if coverage is highly uneven.
    - Prefer flexible masking so samples can be partially observed across V views.

objectives:
  balancing:
    - Normalize branch losses to make reconstruction, diffusion, clustering, and contrastive losses comparable.
    - Use outer lambda weights to balance view branches and fused consistency.
  consistency:
    - Save `source_mode` or view configuration in checkpoints.
    - Reuse saved view structure during evaluation and inference.
    - Keep evaluation aware of view presence and fusion behavior.

implementation_tasks:
  - Refactor training loops to handle V views via loops and `ModuleList`.
  - Improve numerical stability of attention/fusion weights.
  - Improve diffusion conditioning and reverse sampling for missing views.
  - Reduce contrastive cost for larger V by using fused anchors or sampled pairs.
  - Log key statistics per view and per loss term.
  - Convert 2-view-specific dataset loading and mask generation to V-view-capable utilities.

validation_checklist:
  - Run a small training smoke test with V > 2.
  - Verify total loss and per-view losses are finite.
  - Check for NaNs in activations, losses, and gradients.
  - Confirm gradient stability across view branches.
  - Validate evaluation uses recovered latents for missing views correctly.
