project:
  name: DCG
  current_version: >
    The current local DCG implementation is a generalized multi-view
    clustering pipeline that supports an arbitrary number of views through
    per-view autoencoders, per-view latent diffusion denoisers, masked
    attention fusion, and a shared clustering head. During training, missing
    raw views are batch-wise imputed with an observed-feature mean plus noise
    so reconstruction and diffusion can run without branching, but only
    genuinely observed entries contribute encoded latents to fusion and most
    supervision terms. During evaluation, missing target-view latents are
    recovered by reverse diffusion from the average of the available
    source-view latents before masked fusion and clustering.
  implementation_scope:
    training_entry: run.py
    main_model: ICDM.py
    neural_blocks: baseModels.py
    losses: loss.py
    metrics: evaluation.py
    utilities: util.py

workflow:
  summary:
    - run.py loads a multi-view dataset and builds a binary observation mask.
    - Missing raw views are initialized per view from the observed-feature mean plus Gaussian noise before encoding.
    - Each view is encoded by its own autoencoder, but only observed samples contribute latent codes directly.
    - Diffusion denoisers are trained on per-view latent codes.
    - Available per-view latents are fused with the masked attention layer.
    - Cluster assignments are predicted from per-view and fused latents.
    - At evaluation time, missing latents are recovered by reverse diffusion before fusion and clustering.

model_components:
  autoencoders:
    description: Separate encoder-decoder pair for each view.
    latent_space: Encoders map each view into a shared latent dimension.
  diffusion:
    description: View-specific latent denoisers with a shared diffusion schedule.
    training_role: Predict injected Gaussian noise on observed latent codes.
    recovery_role: Iteratively reconstruct missing view latents during evaluation.
    conditioning: Uses a lightweight sinusoidal condition derived from the view index.
  fusion:
    description: AttentionLayer computes a weighted combination of view latents.
    masking: Evaluation respects the observation mask so missing views do not contribute.
  clustering_head:
    description: ClusterProject maps latents to cluster probabilities.

training:
  batch_behavior:
    - Diffusion loss is computed on any observed view.
    - Reconstruction is computed on observed entries; fusion is computed on any sample with at least one observed view.
    - MMI, cluster consistency, pseudo-label, and instance-level consistency losses are only added when the needed observed/shared samples exist.
    - Tiny or unusable batches are skipped.
  callbacks:
    - Intermediate evaluation callbacks run during training every `config['training']['n_eval']`
      epochs, defaulting to `print_num` when unset.
    - Evaluation callbacks reuse the standard masked diffusion recovery path and can optionally
      save checkpoints via `config['training']['save_eval_checkpoint']`.
  optimizer:
    description: run.py jointly optimizes the per-view autoencoders, per-view diffusion models, the clustering head, and the attention layer with Adam.

losses:
  total_objective: >
    The total loss combines reconstruction, diffusion, instance-level consistency,
    mutual-information, clustering, and high-confidence pseudo-label terms.
    In the current code path these weights are fixed to 1.0 each.
  active_terms:
    reconstruction: Reconstructs each observed view input from its latent code.
    diffusion: Matches predicted noise to sampled noise on observed latents.
    contrastive: Aligns reverse-diffused target-view latents with the fused latent anchor.
    mmi: Enforces consistency between fused and per-view observed latents when those latents are non-degenerate.
    clustering: Aligns per-view cluster predictions with the fused prediction.
    high_confidence: Sharpens fused cluster predictions using a mean-fused pseudo-target.

missing_views:
  training_time: >
    Missing raw inputs are initialized per view using the mean of observed samples
    plus Gaussian noise, while the binary observation mask is still preserved for
    downstream diffusion, fusion, contrastive, and MMI logic.
  evaluation_time: >
    Observed views are encoded directly; missing target-view latents are recovered by
    reverse diffusion from the average of the available source-view latents.

current_limits:
  - Training still uses simple mean-plus-noise raw-view imputation; the richer cross-view linear imputation helper in run.py is not part of the active pipeline.
  - Reverse diffusion for a missing target view is initialized from the plain average of the available source-view latents, which is a simple heuristic and may underuse cross-view structure.
  - Diffusion conditioning is limited to a lightweight sinusoidal signal derived from the view index rather than learned cross-view or sample-specific conditioning.
  - Reconstruction, MMI, cluster consistency, and instance-level consistency losses are only applied on samples and views with the needed observed targets, so missing views receive mostly indirect supervision.
  - Very small or weakly usable batches are skipped, which can reduce training efficiency on datasets with high missing-view rates.
  - Evaluation checkpoints are periodic and training does not include a dedicated validation split, early stopping, or model-selection logic beyond tracking the best reported evaluation scores.
